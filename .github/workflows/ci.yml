name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bestcoffee_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Rebuild native modules
        run: pnpm rebuild esbuild prisma @prisma/engines @prisma/client unrs-resolver protobufjs "@node-rs/argon2"

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run Unit Tests
        run: pnpm test

      # Aislamiento entre tiendas contra un Postgres real (servicio del job).
      - name: Apply migrations to the test database
        run: pnpm prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestcoffee_test
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bestcoffee_test

      - name: Run E2E Tests (tenant isolation)
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bestcoffee_test

      - name: Build NestJS Application
        run: pnpm build

